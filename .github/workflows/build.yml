name: Build check

# Corre en cada Pull Request hacia main, y también en pushes directos a
# main (por si algún día se hace un merge sin PR) — así cualquier PR
# muestra un check verde/rojo antes de poder mergear, en vez de
# enterarte de que algo no compila hasta que ya está en el servidor.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # Definidas a nivel de job (no solo en el paso "Build") porque
    # "Generate Prisma client" también necesita DATABASE_URL desde que
    # prisma.config.ts la lee vía env("DATABASE_URL") — si solo estaba
    # en el paso de Build, ese paso anterior fallaba antes de llegar
    # siquiera a usarlas.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_GOOGLE_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Next.js 14 requiere Node 18.17+ o 20+. Usamos 20 LTS.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Genera el cliente de Prisma a partir de schema.prisma. Con
      # Prisma 7, esto SÍ necesita DATABASE_URL disponible, porque
      # prisma.config.ts la resuelve vía env("DATABASE_URL") aunque no
      # se conecte de verdad a la base de datos.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build